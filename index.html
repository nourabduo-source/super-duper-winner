<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الموظفين</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #123b63;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tabs button {
      border: 0;
      background: white;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 1px 5px #ccc;
    }

    .tabs button.active {
      background: #123b63;
      color: white;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px #ddd;
    }

    .card h2 {
      margin-top: 0;
      color: #123b63;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .primary {
      background: #123b63;
      color: white;
    }

    .success {
      background: #168447;
      color: white;
    }

    .danger {
      background: #c0392b;
      color: white;
    }

    .warning {
      background: #d99000;
      color: white;
    }

    .gray {
      background: #777;
      color: white;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success-msg {
      background: #dff5e6;
      color: #126b36;
    }

    .status.error-msg {
      background: #fde3e1;
      color: #a32117;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      border-bottom: 1px solid #eee;
      padding: 12px 8px;
      text-align: right;
    }

    th {
      background: #f0f3f6;
      color: #123b63;
    }

    .actions {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 15px;
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      background: white;
      width: 100%;
      max-width: 550px;
      border-radius: 12px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-box h2 {
      margin-top: 0;
      color: #123b63;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    .hidden {
      display: none !important;
    }

    .big-action {
      min-width: 180px;
      padding: 18px;
      font-size: 17px;
      font-weight: bold;
    }

    .employee-name {
      font-weight: bold;
      color: #123b63;
    }

    .present {
      color: #168447;
      font-weight: bold;
    }

    .absent {
      color: #c0392b;
      font-weight: bold;
    }

    @media(max-width:600px) {
      header h1 {
        font-size: 20px;
      }

      .card {
        padding: 14px;
      }

      .big-action {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>نظام إدارة الموظفين</h1>
</header>

<div class="container">

  <div class="tabs">
    <button class="tab active" onclick="showPage('home', this)">الرئيسية</button>
    <button class="tab" onclick="showPage('employees', this)">الموظفون</button>
    <button class="tab" onclick="showPage('attendance', this)">الحضور والانصراف</button>
    <button class="tab" onclick="showPage('salaries', this)">الرواتب</button>
  </div>

  <div id="statusBox" class="status"></div>

  <!-- الرئيسية -->
  <section id="home" class="page active">
    <div class="card">
      <h2>الرئيسية</h2>
      <p>مرحبًا بك في نظام إدارة الموظفين.</p>

      <div class="buttons">
        <button class="primary" onclick="showPageByName('employees')">
          إدارة الموظفين
        </button>

        <button class="success" onclick="showPageByName('attendance')">
          تسجيل الحضور والانصراف
        </button>

        <button class="warning" onclick="showPageByName('salaries')">
          الرواتب
        </button>
      </div>
    </div>
  </section>

  <!-- الموظفون -->
  <section id="employees" class="page">

    <div class="card">
      <h2>الموظفون</h2>

      <div class="buttons">
        <button class="primary" onclick="openEmployeeModal()">
          + إضافة موظف
        </button>

        <button class="gray" onclick="loadEmployees()">
          تحديث
        </button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>اسم الموظف</th>
              <th>كود الموظف</th>
              <th>رقم الهاتف</th>
              <th>الوظيفة</th>
              <th>الراتب الشهري</th>
              <th>الإجراءات</th>
            </tr>
          </thead>

          <tbody id="employeesTableBody">
            <tr>
              <td colspan="6">جاري التحميل...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
